# Copy this structure into Streamlit Community Cloud Secrets or a local
# .streamlit/secrets.toml file. Never commit the real values.

[auth]
redirect_uri = "https://data-4-decision.streamlit.app/oauth2callback"
cookie_secret = "GENERATE-A-LONG-RANDOM-SECRET"

[auth.google]
client_id = "YOUR-GOOGLE-CLIENT-ID"
client_secret = "YOUR-GOOGLE-CLIENT-SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[app]
# One-time first administrator identity for a new OIDC deployment.
bootstrap_admin_email = "admin@your-organization.org"
